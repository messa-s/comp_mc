name: Flutter Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter with Caching
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true          # Automatically caches the Flutter SDK
          pub-cache: true      # Automatically caches your Pub dependencies
          # Optional: Force a cache refresh by changing the hash prefix if needed
          # cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
